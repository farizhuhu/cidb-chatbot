ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/app/backend/public

    # "/" serves the chat widget; anything unmatched falls through to the API.
    DirectoryIndex home.html index.php

    <Directory /var/www/app/backend/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </Directory>

    # Never expose dotfiles
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
